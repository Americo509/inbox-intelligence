name: inbox-intelligence

services:
  postgres:
    image: postgres:16-alpine
    container_name: inbox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inbox}
      POSTGRES_DB: ${POSTGRES_DB:-inbox}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - inbox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - inbox_net

  redis:
    image: redis:7-alpine
    container_name: inbox_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - inbox_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - inbox_net

volumes:
  inbox_postgres_data:
  inbox_redis_data:

networks:
  inbox_net:
    driver: bridge
